name: Deploy flipbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out flipbook repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble site and fetch encrypted Amma book
        shell: bash
        run: |
          mkdir site
          rsync -a --exclude='.git/' --exclude='site/' ./ site/
          mkdir -p site/books
          curl --fail --location --retry 3 \
            'https://github.com/Yashwanth9898GitHub/Akshara-Flipbook/releases/download/book-pdfs-v1/AMMA-encrypted.pdf' \
            --output site/books/AMMA-encrypted.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4